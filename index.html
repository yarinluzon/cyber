<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>כניסה</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-container">
    <div class="tabs">
      <button type="button" class="tab-btn active" data-tab="login">התחברות</button>
      <button type="button" class="tab-btn" data-tab="signup">הרשמה</button>
    </div>

    <div id="login-panel" class="tab-panel active">
      <h2>🔐 התחברות</h2>
      <form id="loginForm" onsubmit="return login(event)">
        <label for="email">אימייל:</label>
        <input type="email" id="email" required>

        <label for="password">סיסמה:</label>
        <input type="password" id="password" required>

        <button type="submit">התחבר</button>
      </form>
    </div>

    <div id="signup-panel" class="tab-panel">
      <h2>📝 הרשמה</h2>
      <form id="signupForm" onsubmit="return signup(event)">
        <label for="fullName">שם מלא:</label>
        <input type="text" id="fullName" required>

        <label for="signupEmail">אימייל:</label>
        <input type="email" id="signupEmail" required>

        <label for="signupPassword">סיסמה:</label>
        <input type="password" id="signupPassword" required minlength="4">

        <button type="submit">צור חשבון</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
